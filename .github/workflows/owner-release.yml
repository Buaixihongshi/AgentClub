name: Owner release
on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to approve at its current head
        required: true
      sha:
        description: Full reviewed head SHA
        required: true
permissions:
  contents: read
  pull-requests: read
  statuses: write
jobs:
  approve:
    if: github.actor == 'Buaixihongshi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ inputs.pr }}
          REVIEWED_SHA: ${{ inputs.sha }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const pull_number = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(pull_number) || pull_number < 1) throw Error('Invalid PR');
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number});
            const { validateApproval } = require('./.github/scripts/owner-approval.cjs');
            const status = validateApproval({actor: context.actor, owner, ref: context.ref,
              pr, sha: process.env.REVIEWED_SHA});
            await github.rest.repos.createCommitStatus({owner, repo, ...status,
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`});
