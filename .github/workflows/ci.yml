name: CI

on:
  pull_request:
    branches:
      - main
      - 'codex/**'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        run: ./scripts/check.sh backend

      - name: Run offline smoke checks
        run: |
          ./scripts/check.sh smoke

      - name: Run privacy check
        run: ./scripts/check.sh privacy

      - name: Run offline eval harness smoke
        run: ./scripts/check.sh eval

      - name: Check patch hygiene
        run: ./scripts/check.sh hygiene

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests and build
        working-directory: .
        run: ./scripts/check.sh frontend

      - name: Audit frontend dependencies
        working-directory: .
        run: ./scripts/check.sh audit
