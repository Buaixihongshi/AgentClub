name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Run offline smoke checks
        run: |
          python scripts/smoke_onboarding.py --fresh --fake
          python scripts/smoke_conversation_flow.py --fake
          python scripts/smoke_real_cli_mission.py --fake
          python scripts/smoke_roundtable.py --fake

      - name: Run privacy check
        run: python scripts/privacy-check.py

      - name: Run offline eval harness smoke
        run: python scripts/run_eval.py --mode fixture --quiet --output "${RUNNER_TEMP:-/tmp}/agentclub-eval-ci"

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build
